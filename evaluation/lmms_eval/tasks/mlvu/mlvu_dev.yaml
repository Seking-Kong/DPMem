dataset_path: ./data/MLVU/json
dataset_kwargs:
  data_files:
    test:
      - 1_plotQA.json
      - 2_needle.json
      - 3_ego.json
      - 4_count.json
      - 5_order.json
      - 6_anomaly_reco.json
      - 7_topic_reasoning.json
  token: False
  cache_dir: ./data/MLVU
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
task: mlvu_dev
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mlvu_doc_to_visual_dev
doc_to_text: !function utils.mlvu_doc_to_text
doc_to_target: "answer"
# The return value of process_results will be used by metrics
process_results: !function utils.mlvu_process_results
# Note that the metric name can be either a registed metric function (such as the case for GQA) or a key name returned by process_results
metric_list:
  - metric: mlvu_percetion_score
    aggregation: !function utils.mlvu_aggregate_results_dev
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nOnly give the best option.\nBest option: ("
  plm:
    pre_prompt: ""
    post_prompt: "\nOnly give the best option."
